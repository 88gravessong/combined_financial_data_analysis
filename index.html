<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务数据分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .module-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .module-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #333;
        }

        .module-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .module-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .module-btn input[type="radio"] {
            display: none;
        }

        .upload-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .upload-box {
            border: 3px dashed #ccc;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            background: #f9f9f9;
            transition: all 0.3s ease;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .upload-box:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-5px);
        }

        .upload-box.dragover {
            border-color: #667eea;
            background: #e3f2fd;
            transform: scale(1.02);
        }

        .upload-box h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .upload-box p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-list {
            margin-top: 15px;
            text-align: left;
        }

        .file-item {
            background: #e8f5e8;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .file-item .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }

        .process-section {
            text-align: center;
            margin-top: 40px;
        }

        .process-btn {
            background: linear-gradient(45deg, #2ed573, #1e90ff);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .process-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(46, 213, 115, 0.4);
        }

        .process-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .progress {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #2ed573, #1e90ff);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .download-btn {
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* Summary table styles */
        .summary-container {
            margin-top: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            overflow: hidden;
            display: none;
        }
        .summary-header {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .summary-header h3 { color: #333; font-size: 1.1rem; }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th, .summary-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f3f3f3;
            text-align: right;
            font-size: 0.92rem;
        }
        .summary-table th { background: #fafafa; color: #555; }
        .summary-table td.name, .summary-table th.name,
        .summary-table td.sku, .summary-table th.sku { text-align: left; }
        .summary-empty { padding: 16px 18px; color: #777; }
        .summary-table tr.total { background: #fffbe6; font-weight: 600; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .upload-section {
                grid-template-columns: 1fr;
            }

            .module-selector {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 财务数据分析系统</h1>
        
        <!-- 简洁的模块选择器 -->
        <div class="module-selector">
            <label class="module-btn active">
                <input type="radio" name="analysis_type" value="indonesia" checked>
                印尼财务分析
            </label>
            <label class="module-btn">
                <input type="radio" name="analysis_type" value="malaysia">
                跨境店财务分析
            </label>
            
        </div>
        
        <!-- 参数设置 -->
        <div id="param-panel" style="margin: 10px 0 24px; background:#fff; border:1px solid #eee; border-radius:12px; padding:16px;">
            <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
                <div>
                    <label for="country" style="display:block; color:#555; font-size:12px; margin-bottom:6px;">国家</label>
                    <select id="country" style="padding:8px 10px; border:1px solid #ddd; border-radius:8px; min-width:220px; background:#fff; appearance:auto;">
                        <option value="Indonesia">Indonesia</option>
                        <option value="Malaysia">Malaysia</option>
                        <option value="Vietnam">Vietnam</option>
                        <option value="Thailand">Thailand</option>
                        <option value="Philippines">Philippines</option>
                        <option value="Singapore">Singapore</option>
                    </select>
                </div>
                <div>
                    <label for="rate-local-per-rmb" style="display:block; color:#555; font-size:12px; margin-bottom:6px;">本币/人民币</label>
                    <input id="rate-local-per-rmb" type="number" step="any" placeholder="印尼盾/人民币=2300；马币/人民币=0.6" style="padding:8px 10px; border:1px solid #ddd; border-radius:8px; min-width:220px;" />
                </div>
                <div id="usd-rate-wrap">
                    <label for="rate-local-per-usd" style="display:block; color:#555; font-size:12px; margin-bottom:6px;">本币/美元（可选）</label>
                    <input id="rate-local-per-usd" type="number" step="any" placeholder="印尼盾/美元=16000；无则留空" style="padding:8px 10px; border:1px solid #ddd; border-radius:8px; min-width:220px;" />
                </div>
            </div>
            <small style="display:block; color:#888; margin-top:8px;">提示：若不填写，将使用各模块默认汇率（印尼: 2300/16000；马来: 0.6）。</small>
        </div>
        
        <div class="upload-section">
            <!-- 订单表上传区域 -->
            <div class="upload-box" data-type="orders">
                <h3>📋 订单表</h3>
                <p>拖拽或点击上传订单Excel文件<br>支持多个文件</p>
                <button class="upload-btn" onclick="document.getElementById('orders-input').click()">选择文件</button>
                <input type="file" id="orders-input" class="file-input" multiple accept=".xlsx,.xls" data-type="orders">
                <div class="file-list" id="orders-list"></div>
            </div>

            <!-- 结算表上传区域 -->
            <div class="upload-box" data-type="settlements">
                <h3>💳 结算表</h3>
                <p>拖拽或点击上传结算Excel文件<br>支持多个文件</p>
                <button class="upload-btn" onclick="document.getElementById('settlements-input').click()">选择文件</button>
                <input type="file" id="settlements-input" class="file-input" multiple accept=".xlsx,.xls" data-type="settlements">
                <div class="file-list" id="settlements-list"></div>
            </div>

            <!-- 产品消耗表上传区域 -->
            <div class="upload-box" data-type="consumption">
                <h3>📊 产品成本消耗表</h3>
                <p>拖拽或点击上传产品消耗Excel文件<br>仅支持单个文件</p>
                <button class="upload-btn" onclick="document.getElementById('consumption-input').click()">选择文件</button>
                <input type="file" id="consumption-input" class="file-input" accept=".xlsx,.xls" data-type="consumption">
                <div class="file-list" id="consumption-list"></div>
            </div>
        </div>

        <div class="process-section">
            <button class="process-btn" id="process-btn" onclick="processFiles()" disabled>
                🚀 开始分析
            </button>
            
            <div class="progress" id="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="result" id="result"></div>

            <div id="summary" class="summary-container">
                <div class="summary-header">
                    <h3>📊 关键指标（按订单量降序）</h3>
                    <small id="summary-count"></small>
                </div>
                <div id="summary-body">
                    <div class="summary-empty">暂无数据</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileStorage = {
            orders: [],
            settlements: [],
            consumption: null
        };

        // 预设国家与本币/人民币（以及印尼的本币/美元）汇率
        // 注：汇率可在页面内覆盖，以下仅为便捷预设。
        const PRESET_RATES = {
            Indonesia:   { ccy: 'IDR', rmb: 2300, usd: 16000 },
            Malaysia:    { ccy: 'MYR', rmb: 0.6 },
            Vietnam:     { ccy: 'VND', rmb: 3500 },
            Thailand:    { ccy: 'THB', rmb: 5.0 },
            Philippines: { ccy: 'PHP', rmb: 8.0 },
            Singapore:   { ccy: 'SGD', rmb: 0.19 },
        };

        // 初始化拖拽功能
        document.querySelectorAll('.upload-box').forEach(box => {
            box.addEventListener('dragover', handleDragOver);
            box.addEventListener('dragenter', handleDragEnter);
            box.addEventListener('dragleave', handleDragLeave);
            box.addEventListener('drop', handleDrop);
        });

        // 初始化文件输入功能
        document.querySelectorAll('.file-input').forEach(input => {
            input.addEventListener('change', handleFileSelect);
        });

        // 初始化模块选择功能
        document.querySelectorAll('input[name="analysis_type"]').forEach(radio => {
            radio.addEventListener('change', handleModuleChange);
        });

        // 国家选择变更 → 自动填充预设汇率（不覆盖已填写的非空值）
        document.getElementById('country').addEventListener('change', () => {
            applyPresetRates();
        });

        function handleModuleChange(e) {
            // 更新按钮样式
            document.querySelectorAll('.module-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            e.target.closest('.module-btn').classList.add('active');

            // 根据模块控制美元输入显隐，并应用预设
            const module = e.target.value;
            const rateUsdWrap = document.getElementById('usd-rate-wrap');
            if (module === 'indonesia') {
                rateUsdWrap.style.display = '';
            } else {
                rateUsdWrap.style.display = 'none';
                document.getElementById('rate-local-per-usd').value = '';
            }
            applyPresetRates();
        }

        function applyPresetRates() {
            const country = document.getElementById('country').value;
            const selectedModule = document.querySelector('input[name="analysis_type"]:checked').value;
            const rateRmb = document.getElementById('rate-local-per-rmb');
            const rateUsd = document.getElementById('rate-local-per-usd');

            const preset = PRESET_RATES[country];
            if (preset) {
                if (!rateRmb.value) rateRmb.value = String(preset.rmb ?? '');
                // 仅印尼模块使用美元预设
                if (selectedModule === 'indonesia') {
                    if (!rateUsd.value && country === 'Indonesia') {
                        rateUsd.value = String(preset.usd ?? '');
                    }
                }
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files);
            const type = this.dataset.type;
            
            addFiles(type, files);
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            const type = e.target.dataset.type;
            
            addFiles(type, files);
        }

        function addFiles(type, files) {
            // 验证文件类型
            const validFiles = files.filter(file => 
                file.name.endsWith('.xlsx') || file.name.endsWith('.xls')
            );

            if (validFiles.length !== files.length) {
                alert('请上传Excel文件（.xlsx或.xls格式）');
            }

            if (type === 'consumption') {
                // 产品消耗表只允许一个文件
                fileStorage.consumption = validFiles[0] || null;
            } else {
                // 订单表和结算表允许多个文件
                fileStorage[type] = [...fileStorage[type], ...validFiles];
            }

            updateFileList(type);
            updateProcessButton();
        }

        function updateFileList(type) {
            const listContainer = document.getElementById(`${type}-list`);
            listContainer.innerHTML = '';

            if (type === 'consumption') {
                if (fileStorage.consumption) {
                    const fileItem = createFileItem(fileStorage.consumption.name, () => {
                        fileStorage.consumption = null;
                        updateFileList(type);
                        updateProcessButton();
                    });
                    listContainer.appendChild(fileItem);
                }
            } else {
                fileStorage[type].forEach((file, index) => {
                    const fileItem = createFileItem(file.name, () => {
                        fileStorage[type].splice(index, 1);
                        updateFileList(type);
                        updateProcessButton();
                    });
                    listContainer.appendChild(fileItem);
                });
            }
        }

        function createFileItem(fileName, onRemove) {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <span title="${fileName}">${fileName.length > 25 ? fileName.substring(0, 25) + '...' : fileName}</span>
                <button class="remove-btn" onclick="event.stopPropagation()">×</button>
            `;
            item.querySelector('.remove-btn').addEventListener('click', onRemove);
            return item;
        }

        function updateProcessButton() {
            const hasOrders = fileStorage.orders.length > 0;
            const hasSettlements = fileStorage.settlements.length > 0;
            const hasConsumption = fileStorage.consumption !== null;

            const processBtn = document.getElementById('process-btn');
            processBtn.disabled = !(hasOrders && hasSettlements && hasConsumption);
        }

        async function processFiles() {
            const processBtn = document.getElementById('process-btn');
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progress-bar');
            const result = document.getElementById('result');
            const summary = document.getElementById('summary');
            const summaryBody = document.getElementById('summary-body');
            const summaryCount = document.getElementById('summary-count');

            // 禁用按钮并显示进度条
            processBtn.disabled = true;
            processBtn.textContent = '⏳ 处理中...';
            progress.style.display = 'block';
            result.style.display = 'none';
            summary.style.display = 'none';

            try {
                // 准备FormData
                const formData = new FormData();
                
                // 获取选中的分析模块
                const selectedModule = document.querySelector('input[name="analysis_type"]:checked').value;
                formData.append('analysis_type', selectedModule);
                
                // 添加订单文件
                fileStorage.orders.forEach((file, index) => {
                    formData.append('orders', file);
                });
                
                // 添加结算文件
                fileStorage.settlements.forEach((file, index) => {
                    formData.append('settlements', file);
                });
                
                // 添加消耗文件
                formData.append('consumption', fileStorage.consumption);

                // 附加国家与汇率参数
                const country = (document.getElementById('country').value || '').trim();
                const rateLocalPerRmb = (document.getElementById('rate-local-per-rmb').value || '').trim();
                const rateLocalPerUsd = (document.getElementById('rate-local-per-usd').value || '').trim();
                if (country) formData.append('country', country);
                if (rateLocalPerRmb) formData.append('rate_local_per_rmb', rateLocalPerRmb);
                if (rateLocalPerUsd) formData.append('rate_local_per_usd', rateLocalPerUsd);

                // 模拟进度更新
                let progress_value = 0;
                const progressInterval = setInterval(() => {
                    progress_value += Math.random() * 20;
                    if (progress_value > 90) progress_value = 90;
                    progressBar.style.width = `${progress_value}%`;
                }, 300);

                // 发送请求
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    
                    const moduleName = selectedModule === 'malaysia' ? '跨境店' : '印尼';
                    const downloadName = selectedModule === 'malaysia' ? '跨境店财务分析结果.xlsx' : '印尼财务分析结果.xlsx';
                    
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✅ 处理完成！</h3>
                        <p>${moduleName}财务分析报告已生成</p>
                        <a href="${url}" download="${downloadName}" class="download-btn">📥 下载结果文件</a>
                    `;

                    // 请求概要指标(JSON)并渲染
                    const formData2 = new FormData();
                    formData2.append('analysis_type', selectedModule);
                    fileStorage.orders.forEach((file) => formData2.append('orders', file));
                    fileStorage.settlements.forEach((file) => formData2.append('settlements', file));
                    formData2.append('consumption', fileStorage.consumption);
                    if (country) formData2.append('country', country);
                    if (rateLocalPerRmb) formData2.append('rate_local_per_rmb', rateLocalPerRmb);
                    if (rateLocalPerUsd) formData2.append('rate_local_per_usd', rateLocalPerUsd);

                    try {
                        const res2 = await fetch('/process_summary', { method: 'POST', body: formData2 });
                        if (res2.ok) {
                            const data = await res2.json();
                            renderSummaryTable(data.summary);
                            summaryCount.textContent = `${data.count} 条记录`;
                            summary.style.display = 'block';
                        } else {
                            summaryBody.innerHTML = '<div class="summary-empty">获取概要指标失败</div>';
                            summary.style.display = 'block';
                        }
                    } catch (e) {
                        summaryBody.innerHTML = '<div class="summary-empty">获取概要指标失败</div>';
                        summary.style.display = 'block';
                    }
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '处理失败');
                }

            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ 处理失败</h3>
                    <p>错误信息：${error.message}</p>
                `;
            } finally {
                processBtn.disabled = false;
                processBtn.textContent = '🚀 开始分析';
                progress.style.display = 'none';
                progressBar.style.width = '0%';
                result.style.display = 'block';
                updateProcessButton();
            }
        }

        function renderSummaryTable(rows) {
            const container = document.getElementById('summary-body');
            if (!rows || rows.length === 0) {
                container.innerHTML = '<div class="summary-empty">暂无数据</div>';
                return;
            }

            // 前端保险再按订单量降序
            rows = [...rows].sort((a, b) => (b['订单量'] || 0) - (a['订单量'] || 0));

            const formatPercent = (v) => {
                const n = Number(v);
                if (!isFinite(n)) return '-';
                return (n * 100).toFixed(2) + '%';
            };
            const formatMoney = (v) => {
                const n = Number(v);
                if (!isFinite(n)) return '-';
                return '¥' + n.toFixed(2);
            };

            let html = '<table class="summary-table">';
            html += '<thead><tr>' +
                '<th class="name">产品名</th>' +
                '<th class="sku">SKU</th>' +
                '<th>订单量</th>' +
                '<th>签收率</th>' +
                '<th>人民币利润</th>' +
                '<th>每单利润</th>' +
                '<th>毛利润率</th>' +
            '</tr></thead><tbody>';

            rows.forEach(r => {
                html += '<tr>' +
                    `<td class="name">${escapeHtml(r['产品名'] ?? '')}</td>` +
                    `<td class="sku">${escapeHtml(r['sku'] ?? '')}</td>` +
                    `<td>${Number(r['订单量'] ?? 0)}</td>` +
                    `<td>${formatPercent(r['签收率'])}</td>` +
                    `<td>${formatMoney(r['人民币利润'])}</td>` +
                    `<td>${formatMoney(r['每单利润'])}</td>` +
                    `<td>${formatPercent(r['毛利润率'])}</td>` +
                '</tr>';
            });
            // 计算总计
            const sumBy = (key) => rows.reduce((acc, r) => acc + (Number(r[key]) || 0), 0);
            const totalOrders = sumBy('订单量');
            const hasSigned = rows.some(r => '签收订单数' in r);
            const totalSigned = hasSigned ? sumBy('签收订单数') : null;
            const totalRmbProfit = sumBy('人民币利润');
            const hasGrossParts = rows.some(r => '毛利率分子' in r) && rows.some(r => '毛利率分母' in r);
            const totalGrossNum = hasGrossParts ? sumBy('毛利率分子') : null;
            const totalGrossDen = hasGrossParts ? sumBy('毛利率分母') : null;

            const totalSignRate = (totalSigned !== null && totalOrders > 0) ? (totalSigned / totalOrders) : null;
            const totalPerOrderProfit = (totalSigned && totalSigned > 0) ? (totalRmbProfit / totalSigned) : null;
            const totalGrossMargin = (totalGrossNum !== null && totalGrossDen && totalGrossDen > 0)
                ? (totalGrossNum / totalGrossDen) : null;

            html += `<tr class="total">` +
                `<td class="name">总计</td>` +
                `<td class="sku">-</td>` +
                `<td>${totalOrders}</td>` +
                `<td>${totalSignRate === null ? '-' : formatPercent(totalSignRate)}</td>` +
                `<td>${formatMoney(totalRmbProfit)}</td>` +
                `<td>${totalPerOrderProfit === null ? '-' : formatMoney(totalPerOrderProfit)}</td>` +
                `<td>${totalGrossMargin === null ? '-' : formatPercent(totalGrossMargin)}</td>` +
            `</tr>`;

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 初始化一次模块切换逻辑以填充默认汇率
        window.addEventListener('DOMContentLoaded', () => {
            const checked = document.querySelector('input[name="analysis_type"]:checked');
            if (checked) {
                handleModuleChange({ target: checked });
            }
        });
    </script>
</body>
</html>
